[package]
name = "chenzt23-tg-rcore-tutorial-ch2-t3l2"
description = "Chapter 2 of rCore Tutorial: Batch processing system with privilege levels and trap handling."
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Zitao Chen <chen-zt23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/MuZhao2333/tg-rcore-tutorial/"
homepage = "https://github.com/MuZhao2333/tg-rcore-tutorial/tree/t3l2/tg-rcore-tutorial-ch2"
documentation = "https://docs.rs/tg-rcore-tutorial-ch2"
license = "GPL-3.0"
readme = "README.md"
keywords =  ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]
exclude = [
    "tg-user/**",
#    ".cargo/config.toml",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
riscv = "0.10.1"
virtio-drivers = "0.1.0"
spin = "0.9"

tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-rcore-tutorial-sbi", version = "0.4.8", features = ["nobios"] }
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
tg-console = { package = "tg-rcore-tutorial-console", path = "../tg-rcore-tutorial-console", version = "0.4.8" }
tg-kernel-context = { package = "tg-rcore-tutorial-kernel-context", path = "../tg-rcore-tutorial-kernel-context", version = "0.4.8" }
tg-syscall = { package = "chenzt23-tg-rcore-tutorial-syscall-t3l2", path = "../tg-rcore-tutorial-syscall", version = "0.0.1-preview.1", features = ["kernel"] }

[build-dependencies]
tg-linker = { package = "tg-rcore-tutorial-linker", path = "../tg-rcore-tutorial-linker", version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
