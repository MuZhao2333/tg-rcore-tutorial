# 默认编译目标：RISC-V 64 位裸机平台
# 使 cargo build 自动进行交叉编译，无需每次指定 --target
[build]
target = "riscv64gc-unknown-none-elf"

# QEMU 运行器配置
# cargo run 时自动调用此命令执行编译产物
# 启用图形显示，支持 virtio-gpu 设备
[target.riscv64gc-unknown-none-elf]
runner = [
    "qemu-system-riscv64",
    "-machine", "virt",                     # 使用 QEMU virt 虚拟平台
    "-m", "256M",                           # 分配256MB内存
    "-bios", "none",                        # 不加载外部 BIOS/SBI 固件（tg-sbi 内建）
    "-device", "virtio-gpu-device",         # 挂载 VirtIO GPU 设备用于图形显示
    "-device", "virtio-rng-device",         # 添加RNG设备以启动virtio总线
    "-serial", "stdio",                     # 将串口重定向到标准 I/O，显示调试信息
    "-display", "gtk",                      # 启用 GTK 图形显示窗口
    "-kernel",                              # 后接 ELF 可执行文件路径（由 cargo 自动填充）
]
