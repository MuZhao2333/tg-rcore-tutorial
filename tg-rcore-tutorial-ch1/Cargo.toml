[package]
name = "chenzt23-tg-rcore-tutorial-ch1-t2l2"
description = "Chapter 1 of rCore Tutorial: A minimal bare-metal application running in RISC-V S-mode with clock interrupt support."
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Zitao Chen <chen-zt23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/rcore-os/tg-rcore-tutorial"
homepage = "https://github.com/MuZhao2333/tg-rcore-tutorial/tree/t2l2/tg-rcore-tutorial-ch1"
documentation = "https://docs.rs/tg-rcore-tutorial-ch1"
license = "GPL-3.0"
readme = "README.md"
keywords = ["ai", "ai4ose", "kernel", "learning", "os"]
categories = ["no-std", "embedded"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
riscv = "0.10.1"
tg-sbi = { package = "tg-rcore-tutorial-sbi", path = "../tg-rcore-tutorial-sbi", version = "0.4.8", features = ["nobios"] }
